name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Linux core
        if: runner.os == 'Linux'
        run: python scripts/fetch-core.py --platform linux-amd64
      - name: Fetch Windows core
        if: runner.os == 'Windows'
        run: python scripts/fetch-core.py --platform windows-amd64
      - name: Tests and race detector (Linux)
        if: runner.os == 'Linux'
        env:
          PORTTIDE_TEST_CORE: core/xray
        run: go test -race ./...
      - name: Native Windows tests
        if: runner.os == 'Windows'
        env:
          PORTTIDE_TEST_CORE: core/xray.exe
        run: go test ./...
      - run: go vet ./...
      - name: JavaScript syntax
        run: node --check internal/app/web/app.js
      - name: Portable Windows package
        if: runner.os == 'Windows'
        run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: PortTide-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish-alpha:
    if: startsWith(github.ref, 'refs/tags/v0.')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PortTide-windows-x64
          path: release-assets
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/*.zip release-assets/*.sha256 --verify-tag --prerelease --title "PortTide $GITHUB_REF_NAME" --notes-file docs/releases/0.1.0-alpha.1.md
